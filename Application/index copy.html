<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>モノの管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="topbar"><span>📦</span><h1>モノの管理</h1><button class="btn primary" id="addBtn" onclick="handleAdd()">＋ 追加</button></div>
  <div id="nav">
    <button class="nav-btn active" onclick="switchView('shelves', this)">棚・収納</button>
    <button class="nav-btn" onclick="switchView('search', this)">検索</button>
    <button class="nav-btn" onclick="switchView('all-items', this)">すべてのモノ</button>
  </div>
  <div id="content">
    <div id="view-shelves" class="view active"></div>
    <div id="view-search" class="view"></div>
    <div id="view-all-items" class="view"></div>
    <div id="view-shelf-detail" class="view"></div>
  </div>
</div>

<div class="modal-overlay" id="storageModal">
  <div class="modal">
    <div class="modal-header"><h2>収納場所</h2><button class="btn" onclick="closeModal('storageModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>名前</label><input type="text" id="storageName" /></div>
      <div class="form-group"><label>メモ</label><input type="text" id="storageNum" /></div>
    </div>
    <div class="modal-footer"><button class="btn primary" onclick="saveStorage()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header"><h2 id="itemModalTitle">モノを追加</h2><button class="modal-close" onclick="closeModal('itemModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>モノの名前</label><input type="text" id="itemName" /></div>
      <div class="form-group"><label>収納場所</label><select id="itemStorage"></select></div>
      <div class="form-group"><label>メモ</label><textarea id="itemNote"></textarea></div>
      <div class="form-group">
        <label>画像</label>
        <input type="file" id="itemImageFile" accept="image/*" onchange="previewImage(this)" />
        <div class="preview-area"><img id="imgPreview" class="preview-img" src="" alt="プレビュー" /></div>
      </div>
      <div class="form-group"><label>タグ（Enterで追加）</label>
        <div class="tag-input-wrap" id="tagInputWrap" onclick="document.getElementById('tagInput').focus()">
          <input type="text" id="tagInput" onkeydown="handleTagKey(event)" />
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="closeModal('itemModal')">キャンセル</button><button class="btn primary" onclick="saveItem()">保存</button></div>
  </div>
</div>

<script>
const TAG_COLORS = ['tag-teal','tag-purple','tag-amber','tag-coral','tag-blue','tag-green'];
let currentImageData = null; // 画像データを一時保持する変数

let state = {
  storages: [
    { id: 1, icon: '🗃️', name: 'リビング棚', num: 'A-1' },
    { id: 2, icon: '📦', name: '押し入れ上段', num: 'B-1' }
  ],
  items: [
    { id: 1, name: '冬用コート', storageId: 2, note: 'グレー色', tags: ['衣類'], image: null, createdAt: Date.now() }
  ],
  nextStorageId: 3, nextItemId: 2,
  currentView: 'shelves', pendingTags: []
};

function tagColor(tag) {
  let h = 0; for (let c of tag) h = (h * 31 + c.charCodeAt(0)) & 0xff;
  return TAG_COLORS[h % TAG_COLORS.length];
}

function renderTag(t) { return `<span class="tag ${tagColor(t)}">${t}</span>`; }

// 画像プレビュー処理
function previewImage(input) {
  const file = input.files[0];
  const preview = document.getElementById('imgPreview');
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      currentImageData = e.target.result;
      preview.src = currentImageData;
      preview.style.display = 'block';
    }
    reader.readAsDataURL(file);
  }
}

function switchView(v, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  state.currentView = v;
  if (v === 'shelves') renderShelves();
  if (v === 'all-items') renderAllItems();
}

function renderShelves() {
  const el = document.getElementById('view-shelves');
  el.innerHTML = `<div class="grid">${state.storages.map(s => `
    <div class="storage-card" onclick="openShelf(${s.id})">
      <div class="card-icon">${s.icon}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-count">${state.items.filter(i => i.storageId === s.id).length}点</div>
    </div>`).join('')}</div>`;
}

function openShelf(id) {
  state.currentShelfId = id;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-shelf-detail').classList.add('active');
  renderShelfDetail();
}

function renderShelfDetail() {
  const items = state.items.filter(i => i.storageId === state.currentShelfId);
  const el = document.getElementById('view-shelf-detail');
  el.innerHTML = `<button class="btn" onclick="switchView('shelves')">← 戻る</button>
    <div class="item-list" style="margin-top:16px">${items.map(item => renderItemRow(item)).join('')}</div>`;
}

// アイテムの1行分をレンダリング（画像表示を追加）
function renderItemRow(item) {
  const s = state.storages.find(x => x.id === item.storageId);
  return `
    <div class="item-row">
      ${item.image ? `<img src="${item.image}" class="item-img-thumb" />` : `<div class="item-img-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px">📦</div>`}
      <div style="flex:1">
        <div class="item-name">${item.name}</div>
        ${s ? `<span class="location-badge">${s.name}</span>` : ''}
        <div style="margin-top:4px">${item.tags.map(t => renderTag(t)).join('')}</div>
      </div>
      <button class="icon-btn" onclick="deleteItem(${item.id})">🗑️</button>
    </div>`;
}

function renderAllItems() {
  const el = document.getElementById('view-all-items');
  el.innerHTML = `<div class="item-list">${state.items.map(item => renderItemRow(item)).join('')}</div>`;
}

function handleAdd() { openItemModal(); }

function openItemModal() {
  currentImageData = null;
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('itemImageFile').value = '';
  document.getElementById('itemName').value = '';
  document.getElementById('itemNote').value = '';
  const sel = document.getElementById('itemStorage');
  sel.innerHTML = state.storages.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('itemModal').classList.add('open');
}

function saveItem() {
  const name = document.getElementById('itemName').value.trim();
  if (!name) return alert('名前を入力してください');
  const storageId = parseInt(document.getElementById('itemStorage').value);
  
  state.items.push({
    id: state.nextItemId++,
    name,
    storageId,
    note: document.getElementById('itemNote').value,
    tags: state.pendingTags,
    image: currentImageData, // 画像データを保存
    createdAt: Date.now()
  });
  
  closeModal('itemModal');
  switchView(state.currentView);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function deleteItem(id) { if(confirm('削除しますか？')) { state.items = state.items.filter(i => i.id !== id); switchView(state.currentView); } }

renderShelves();
</script>
</body>
</html>
